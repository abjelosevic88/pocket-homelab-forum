# Pocket Forum (Go + SQLite) — Forums for your family, club, team or community: topics, replies, questions with answers, events, polls, moderation — one Go binary, one SQLite file
services:
  pocket-forum:
    image: ghcr.io/abjelosevic88/pocket-homelab-forum:latest
    container_name: pocket-forum
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Home, Inventory, Wishlist, Photos, Tasks, Notes, Files, Money, Rentals and Chat.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
